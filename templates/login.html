<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Asistente IA de Procesos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <div class="login-bg">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/></svg>
      </div>
      <div class="app-name">Asistente de Procesos · Andina Servicios</div>
      <div class="ms-title">Iniciar sesión</div>
      <div class="ms-sub">Usa tu cuenta corporativa</div>

      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in mensajes %}
          <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="field">
          <label>Usuario</label>
          <input name="usuario" autocomplete="username" placeholder="Escribe tu usuario" autofocus>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input name="password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn" type="submit">Entrar</button>
      </form>

      <p class="muted center" style="margin-top:18px">
        Acceso restringido · La gestión de usuarios es solo para administradores
      </p>
    </div>
  </div>
</body>
</html>
