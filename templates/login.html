<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión · Asistente IA de Procesos</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilos.css') }}">
</head>
<body>
  <div class="login-bg">
    <div class="login-card">
      <div class="brand-emoji">🤖</div>
      <div class="app-name">ASISTENTE IA DE PROCESOS</div>
      <div class="ms-title">Iniciar sesión</div>
      <div class="ms-sub">Usa tu cuenta de la demo</div>

      {% with mensajes = get_flashed_messages(with_categories=true) %}
        {% for cat, msg in mensajes %}
          <div class="flash flash-{{ cat }}">{{ msg }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="field">
          <label>Usuario</label>
          <input name="usuario" autocomplete="username" placeholder="Escribe tu usuario" autofocus>
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input name="password" type="password" autocomplete="current-password" placeholder="••••••••">
        </div>
        <button class="btn" type="submit">Entrar</button>
      </form>

      <p class="muted center" style="margin-top:18px">
        Acceso restringido · La gestión de usuarios es solo para administradores
      </p>
    </div>
  </div>
</body>
</html>
